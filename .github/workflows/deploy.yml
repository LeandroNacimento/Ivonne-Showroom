name: Deploy to Azure VM

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          script: |
            bash <<'EOF'
            set -euo pipefail

            retry_curl() {
              local url="$1"
              local attempts="$2"
              local delay="$3"

              for attempt in $(seq 1 "$attempts"); do
                if curl --fail --silent --show-error "$url" > /dev/null; then
                  return 0
                fi

                if [ "$attempt" -lt "$attempts" ]; then
                  sleep "$delay"
                fi
              done

              return 1
            }

            cd ~/Ivonne-Showroom

            git fetch --prune origin
            git checkout main
            git pull --ff-only origin main

            CURRENT_SHA="$(git rev-parse HEAD)"
            if [ "$CURRENT_SHA" != "$DEPLOY_SHA" ]; then
              echo "Refusing to deploy unexpected commit."
              echo "Expected: $DEPLOY_SHA"
              echo "Current:  $CURRENT_SHA"
              exit 1
            fi

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan migrate --force

            retry_curl "http://127.0.0.1/up" 12 5
            retry_curl "http://127.0.0.1/" 12 5
            EOF
