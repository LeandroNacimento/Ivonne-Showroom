services:
    app:
        env_file:
            - .env
        volumes:
            - ./:/var/www

    vite:
        image: node:20-alpine
        restart: unless-stopped
        working_dir: /var/www
        command: sh -lc "npm run dev -- --host 0.0.0.0 --port 5173"
        ports:
            - "5173:5173"
        volumes:
            - ./:/var/www
        networks:
            - laravel
        depends_on:
            app:
                condition: service_started

    web:
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    db:
        ports:
            - "33061:3306"

