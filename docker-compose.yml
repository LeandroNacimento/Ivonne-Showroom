services:
    app:
        build:
            context: .
            dockerfile: php/Dockerfile
            target: app-runtime
        restart: unless-stopped
        working_dir: /var/www
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        volumes:
            - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
        networks:
            - laravel
        depends_on:
            db:
                condition: service_healthy

    web:
        build:
            context: .
            dockerfile: php/Dockerfile
            target: web-runtime
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        ports:
            - "127.0.0.1:8080:80"
        networks:
            - laravel
        depends_on:
            app:
                condition: service_started

    db:
        image: mysql:8.0
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s
        environment:
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    dbdata:
