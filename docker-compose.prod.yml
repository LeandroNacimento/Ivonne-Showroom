services:
  app:
    ports: []
    volumes:
      - ./.env:/var/www/.env:ro
      - public_storage:/var/www/storage/app/public

  web:
    ports: !reset
      # El host Nginx usa el puerto 80 público.
      # Mapeamos el contenedor al 8080 interno para evitar colisión.
      - "127.0.0.1:8080:80"
    volumes:
      - public_storage:/var/www/public/storage:ro

volumes:
  public_storage:
