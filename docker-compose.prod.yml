services:
  app:
    ports: []
    volumes:
      - ./.env:/var/www/.env:ro
      - public_storage:/var/www/storage/app/public

  web:
    ports:
      # Bind exclusivamente al loopback del host.
      # El Nginx del host hace proxy_pass a 127.0.0.1:80.
      # Ningún cliente externo puede alcanzar este puerto directamente.
      - "127.0.0.1:80:80"
    volumes:
      - public_storage:/var/www/public/storage:ro

volumes:
  public_storage:
